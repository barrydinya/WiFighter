; PlatformIO configuration for WiFighter
; Firmware lives at repo root (Arduino IDE compatible).
; Local board JSONs in ./boards (stock espressif32 only ships m5stick-c).

[platformio]
src_dir = .
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino @ ^1.4.2
; Root sketch layout: include the .ino and headers; skip board JSON / VCS.
build_src_filter =
    +<*>
    -<boards/>
    -<.git/>
    -<.pio/>
; Default 1.2MB app is ~91% full with NimBLE — use min_spiffs (~1.9MB app).
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:m5stick-c-plus]
board = m5stick-c-plus
build_flags =
    ${env.build_flags}
    -DWIFIGHTER_BOARD_PLUS=1

[env:m5stick-c-plus2]
board = m5stick-c-plus2
build_flags =
    ${env.build_flags}
    -DWIFIGHTER_BOARD_PLUS2=1
