; PlatformIO configuration for WiFighter
; Choose one environment

[env:m5stick-c-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c-plus2
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
